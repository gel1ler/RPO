basePath: /api/v1
definitions:
  httpapi.SwaggerAuthLoginRequest:
    properties:
      login:
        type: string
      password:
        type: string
    type: object
  httpapi.SwaggerAuthLoginResponse:
    properties:
      token:
        type: string
    type: object
  httpapi.SwaggerErrorResponse:
    properties:
      error:
        type: string
      message:
        type: string
    type: object
  httpapi.SwaggerKeyDTO:
    properties:
      created_at:
        type: string
      id:
        type: integer
      key_value:
        type: string
      label:
        type: string
    type: object
  httpapi.SwaggerMeResponse:
    properties:
      created_at:
        type: string
      display_name:
        type: string
      id:
        type: integer
      is_admin:
        type: boolean
      login:
        type: string
    type: object
  httpapi.SwaggerTerminalAuthorizeRequest:
    properties:
      amount:
        type: integer
      card_number:
        type: string
      terminal_serial_number:
        type: string
    type: object
  httpapi.SwaggerTerminalAuthorizeResponse:
    properties:
      approved:
        type: boolean
      reason:
        type: string
    type: object
info:
  contact: {}
  description: REST API сервера авторизации платежей транспортными картами.
  title: RPO Authorization API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Returns JWT token
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.SwaggerAuthLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.SwaggerAuthLoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.SwaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.SwaggerErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.SwaggerErrorResponse'
      summary: Login with password
      tags:
      - auth
  /me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.SwaggerMeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.SwaggerErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - auth
  /terminal/authorize:
    post:
      consumes:
      - application/json
      parameters:
      - description: Authorization request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.SwaggerTerminalAuthorizeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.SwaggerTerminalAuthorizeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.SwaggerErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.SwaggerErrorResponse'
      summary: Authorize payment transaction (decision only)
      tags:
      - terminal
  /terminal/keys:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/httpapi.SwaggerKeyDTO'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.SwaggerErrorResponse'
      summary: Load keys for terminals
      tags:
      - terminal
schemes:
- https
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
